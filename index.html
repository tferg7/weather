<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Current weather, UV index, and a 5-day forecast for any city.">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
</head>

<body>
    <header class="site-header">
        <h1>Weather Dashboard</h1>
        <p>Current conditions, UV index, and a 5-day forecast for any city.</p>
    </header>

    <main class="container">
        <div class="row">
            <!-- search and history -->
            <aside class="col-lg-4 mb-4">
                <div class="panel">
                    <h2 class="h5">Search for a city</h2>
                    <form class="d-flex">
                        <label for="city-input" class="sr-only">City</label>
                        <input id="city-input" class="form-control mr-2" type="search" placeholder="e.g. Baton Rouge" autocomplete="off">
                        <button id="select-city" class="btn btn-primary" type="submit">Search</button>
                    </form>
                    <h3 class="h6 mt-4 mb-2 text-muted">Recent searches</h3>
                    <div id="searchhistory"></div>
                </div>
            </aside>

            <!-- results -->
            <section class="col-lg-8">
                <div class="panel current-panel">
                    <div id="current"><p class="text-muted mb-0">Search for a city to see today's weather.</p></div>
                    <div id="uv"></div>
                </div>
                <h2 class="h4 mt-4 mb-3 section-title">5-Day Forecast</h2>
                <div id="5day" class="forecast"></div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        Weather data from <a href="https://openweathermap.org/">OpenWeather</a> · UV index from <a href="https://open-meteo.com/">Open-Meteo</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="./assets/script.js"></script>
</body>

</html>
